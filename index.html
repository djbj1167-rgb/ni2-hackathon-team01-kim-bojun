<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>안전톡 체크 | 안전관리 체크리스트 Q&A</title>
<meta name="description" content="작업 전 점검 체크리스트를 질문으로 찾고, 점검 결과를 저장하는 시제품">
<style>
  :root{
    --bg:#f4f6f8; --card:#fff; --ink:#1c2733; --sub:#5b6875; --line:#dde3e9;
    --main:#0b6b5a; --main-dark:#084c40; --main-soft:#e3f3ef;
    --warn:#a85a00; --warn-soft:#fff1dc; --sample:#5b3fa8; --sample-soft:#efe9fb;
    --ok:#1b7f3b; --ok-soft:#e1f4e7; --na:#546270; --na-soft:#e9edf1; --bad:#b3261e;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    line-height:1.55;font-size:16px}
  header{background:var(--main);color:#fff;padding:14px 16px}
  header .wrap{max-width:760px;margin:0 auto}
  header h1{margin:0;font-size:1.25rem}
  header p{margin:2px 0 0;font-size:.85rem;opacity:.9}
  nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  nav .wrap{max-width:760px;margin:0 auto;display:flex}
  nav button{flex:1;border:0;background:none;padding:13px 8px;font:inherit;font-weight:700;
    color:var(--sub);border-bottom:3px solid transparent;cursor:pointer}
  nav button[aria-selected="true"]{color:var(--main);border-bottom-color:var(--main)}
  main{max-width:760px;margin:0 auto;padding:14px 14px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  h2{font-size:1.05rem;margin:0 0 10px}
  label,.lbl{display:block;font-weight:700;font-size:.92rem;margin:12px 0 6px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font:inherit;
    cursor:pointer;min-height:44px}
  .chip[aria-pressed="true"]{background:var(--main);border-color:var(--main);color:#fff;font-weight:700}
  select,input[type=text],input[type=date],textarea{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);
    border-radius:10px;background:#fff;color:var(--ink);min-height:46px}
  textarea{resize:vertical;min-height:84px}
  :focus-visible{outline:3px solid #f0a500;outline-offset:2px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:520px){.row{grid-template-columns:1fr}}
  .examples{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .ex{border:1px dashed var(--main);background:var(--main-soft);color:var(--main-dark);border-radius:8px;
    padding:8px 10px;font:inherit;font-size:.88rem;cursor:pointer;text-align:left;min-height:40px}
  .btn{display:inline-block;border:0;background:var(--main);color:#fff;font:inherit;font-weight:700;
    padding:13px 18px;border-radius:10px;cursor:pointer;min-height:48px}
  .btn:hover{background:var(--main-dark)}
  .btn.ghost{background:#fff;color:var(--main);border:1.5px solid var(--main)}
  .btn.danger{background:#fff;color:var(--bad);border:1.5px solid var(--bad)}
  .btn.block{width:100%;margin-top:16px}
  .badge{display:inline-block;font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:999px;margin-right:6px;vertical-align:middle}
  .b-sample{background:var(--sample-soft);color:var(--sample)}
  .b-warn{background:var(--warn-soft);color:var(--warn)}
  .b-ok{background:var(--ok-soft);color:var(--ok)}
  .summary{background:var(--main-soft);border-radius:10px;padding:12px 14px;margin:6px 0 12px}
  .notfound{background:var(--warn-soft);border:1px solid #f0c98c;border-radius:10px;padding:14px}
  ul.check{list-style:none;margin:0;padding:0}
  ul.check li{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
  ul.check li.hit{border-color:var(--main);background:#f7fcfb}
  .itxt{font-weight:700;margin-bottom:8px}
  .itxt small{font-weight:400;color:var(--sub);display:block}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{flex:1;min-width:84px;border:1.5px solid var(--line);background:#fff;border-radius:8px;font:inherit;
    padding:9px 6px;cursor:pointer;min-height:44px}
  .seg button[aria-pressed="true"].s-ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
  .seg button[aria-pressed="true"].s-na{background:var(--na);border-color:var(--na);color:#fff;font-weight:700}
  .seg button[aria-pressed="true"].s-no{background:var(--warn);border-color:var(--warn);color:#fff;font-weight:700}
  .src{border-left:4px solid var(--sample);background:#faf8fe;padding:10px 12px;border-radius:0 8px 8px 0;
    font-size:.88rem;margin-top:12px}
  .count{font-size:.9rem;color:var(--sub);margin-top:10px}
  .disc{font-size:.82rem;color:var(--sub);margin-top:14px}
  .empty{text-align:center;color:var(--sub);padding:30px 10px}
  .saved-item{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#fff}
  .saved-item h3{margin:0 0 4px;font-size:1rem}
  .saved-item .meta{font-size:.85rem;color:var(--sub)}
  .saved-item .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .saved-item .acts .btn{padding:9px 14px;min-height:42px;font-size:.9rem}
  .detail{margin-top:10px;font-size:.92rem}
  .detail div{padding:6px 0;border-top:1px solid var(--line)}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1c2733;color:#fff;
    padding:12px 18px;border-radius:10px;font-size:.92rem;display:none;z-index:20;max-width:90%}
  .hidden{display:none !important}

  /* ===== 챗봇 ===== */
  .chat{display:flex;flex-direction:column;height:calc(100vh - 230px);min-height:420px}
  .chat-log{flex:1;overflow-y:auto;padding:4px 2px 8px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:88%;padding:11px 13px;border-radius:14px;font-size:.95rem;word-break:keep-all;overflow-wrap:anywhere}
  .msg.bot{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.user{align-self:flex-end;background:var(--main);color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}
  .msg ol{margin:8px 0 6px;padding-left:20px}
  .msg li{margin-bottom:4px}
  .msg li.hit{color:var(--main-dark);font-weight:700;background:var(--main-soft);border-radius:6px;padding:2px 6px;margin-left:-6px}
  .msg .badges{margin-top:6px}
  .msg .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .msg .acts button{border:1.5px solid var(--main);background:#fff;color:var(--main-dark);border-radius:999px;
    font:inherit;font-size:.86rem;padding:7px 12px;cursor:pointer;min-height:38px}
  .msg .acts button.primary{background:var(--main);color:#fff;font-weight:700}
  .msg small{color:var(--sub)}
  .typing{align-self:flex-start;color:var(--sub);font-size:.9rem;padding:6px 10px}
  .chat-quick{display:flex;gap:6px;overflow-x:auto;padding:8px 0;flex-wrap:nowrap}
  .chat-quick button{flex:none;border:1px dashed var(--main);background:var(--main-soft);color:var(--main-dark);
    border-radius:999px;font:inherit;font-size:.86rem;padding:7px 12px;cursor:pointer;min-height:38px}
  .chat-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .chat-head h2{margin:0}
  .ai-toggle{display:flex;align-items:center;gap:8px;font-size:.86rem;font-weight:700;margin:0;cursor:pointer}
  .ai-toggle input{width:20px;height:20px;min-height:0;accent-color:var(--main)}
  .ai-toggle.off{color:var(--sub);cursor:not-allowed}
  .b-ai{background:#e6f0ff;color:#1a56b0}
  .chat-form{display:flex;gap:8px}
  .chat-form input{flex:1}
  .chat-form .btn{min-height:46px;padding:0 18px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>안전톡 체크</h1>
    <p>작업 전 점검 체크리스트 Q&amp;A · 점검 결과 저장 (시제품)</p>
  </div>
</header>
<nav aria-label="화면 이동">
  <div class="wrap" role="tablist">
    <button role="tab" id="tab-ask" aria-selected="true" aria-controls="view-ask">질문하기</button>
    <button role="tab" id="tab-chat" aria-selected="false" aria-controls="view-chat">챗봇</button>
    <button role="tab" id="tab-saved" aria-selected="false" aria-controls="view-saved">저장된 점검 <span id="savedCount"></span></button>
  </div>
</nav>

<main>
  <!-- 1. 입력 화면 + 결과 화면 -->
  <section id="view-ask" role="tabpanel" aria-labelledby="tab-ask">
    <div class="card">
      <h2>1. 작업 정보 입력</h2>
      <div class="lbl" id="lblTrade">공종 선택</div>
      <div class="chips" id="trades" role="group" aria-labelledby="lblTrade"></div>

      <label for="task">작업 선택</label>
      <select id="task"></select>

      <label for="question">질문 입력</label>
      <textarea id="question" placeholder="예: 고소작업 전에 뭘 확인해야 해?"></textarea>
      <div class="examples" id="examples" aria-label="예시 질문"></div>

      <div class="row">
        <div>
          <label for="siteName">점검 작업명 (저장용)</label>
          <input type="text" id="siteName" placeholder="예: OO현장 2층 배관 작업" maxlength="60">
        </div>
        <div>
          <label for="checkDate">점검 일자</label>
          <input type="date" id="checkDate">
        </div>
      </div>
      <button class="btn block" id="askBtn">질문하기</button>
    </div>

    <div id="result" class="hidden" aria-live="polite"></div>
  </section>

  
  <!-- 챗봇 -->
  <section id="view-chat" role="tabpanel" aria-labelledby="tab-chat" class="hidden">
    <div class="card chat">
      <div class="chat-head">
        <h2>안전톡 챗봇 <span class="badge b-sample">샘플 데이터</span></h2>
        <label class="ai-toggle" id="aiToggleLbl"><input type="checkbox" id="aiToggle"> <span id="aiToggleTxt">AI 답변 모드</span></label>
      </div>
      <div class="chat-log" id="chatLog" role="log" aria-live="polite" aria-label="챗봇 대화"></div>
      <div class="chat-quick" id="chatQuick" aria-label="추천 질문"></div>
      <form class="chat-form" id="chatForm" autocomplete="off">
        <input type="text" id="chatInput" placeholder="예: 용접할 때 화재 예방은?" maxlength="200" aria-label="챗봇에게 질문하기">
        <button type="submit" class="btn">보내기</button>
      </form>
    </div>
  </section>

  <!-- 2. 저장된 점검 -->
  <section id="view-saved" role="tabpanel" aria-labelledby="tab-saved" class="hidden">
    <div class="card">
      <h2>저장된 점검 목록</h2>
      <p class="disc" style="margin-top:0">이 기기의 브라우저에만 저장돼요. 서버로 보내지 않아요.</p>
      <div id="savedList"></div>
    </div>
  </section>

  <p class="disc">
    ※ 이 앱은 해커톤 시제품이에요. 화면의 체크항목은 <b>샘플 데이터</b>이며 ㈜동호엔지니어링의 실제 체크리스트나 법령 기준이 아니에요.
    현장 최종 판단은 안전관리자가 하고, 실제 기준은 반드시 원문 자료로 확인하세요.
  </p>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===========================================================

const EXAMPLES = {

  "소방":["스프링클러 설치 전 점검 항목 알려줘","용접 작업할 때 화재 예방은?"],
  "정보통신":["케이블 포설 작업 전에 뭘 확인해?"],
  "공통":["고소작업 전에 뭘 확인해야 해?","작업 전 안전회의에서 뭘 말해야 해?"]
};

/* ===================== 상태 / 유틸 ===================== */
const $ = id => document.getElementById(id);
const STORE_KEY = "safetalk-check-saved-v1";
let state = { trade:"공통", taskId:null, current:null };

let memStore = []; // 브라우저 저장소를 쓸 수 없을 때(예: 일부 보안 설정) 이 탭이 열려 있는 동안만 유지
let usingMem = false;
function loadSaved(){
  if (usingMem) return memStore;
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }catch(e){ usingMem = true; return memStore; }
}
function storeSaved(list){
  if (!usingMem){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(list)); return true; }catch(e){ usingMem = true; }
  }
  memStore = list; return true;
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.style.display="none", 2400);
}
function todayStr(){
  const d = new Date(), p = n => String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}

/* ===================== 입력 화면 ===================== */
function renderTrades(){
  $("trades").innerHTML = TRADES.map(t =>
    `<button type="button" class="chip" data-trade="${t}" aria-pressed="${t===state.trade}">${t}</button>`).join("");
  $("trades").querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
    state.trade = b.dataset.trade; renderTrades(); renderTasks(); renderExamples();
  }));
}
function renderTasks(){
  const list = TASKS.filter(t => t.trade === state.trade);
  $("task").innerHTML = `<option value="">(작업을 고르지 않음)</option>` +
    list.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join("");
  $("task").value = list.some(t=>t.id===state.taskId) ? state.taskId : "";
  state.taskId = $("task").value || null;
}
function renderExamples(){
  const ex = EXAMPLES[state.trade] || [];
  $("examples").innerHTML = ex.map(q => `<button type="button" class="ex">${esc(q)}</button>`).join("");
  $("examples").querySelectorAll(".ex").forEach(b => b.addEventListener("click", () => {
    $("question").value = b.textContent; ask();
  }));
}

/* ===================== 질문 → 답 찾기 ===================== */
function score(task, q){
  const text = q.toLowerCase().replace(/\s+/g," ");
  let s = 0;
  if (text.includes(task.name.toLowerCase())) s += 3;
  task.keywords.forEach(k => { if (text.includes(k.toLowerCase())) s += 2; });
  task.items.forEach(it => {
    it.split(/[\s(),·]+/).forEach(w => { if (w.length >= 2 && text.includes(w.toLowerCase())) s += 0.5; });
  });
  return s;
}
function findAnswer(){
  const q = $("question").value.trim();
  const picked = TASKS.find(t => t.id === state.taskId);
  if (!q && !picked) return {kind:"empty"};
  if (!q && picked) return {kind:"task", task:picked, q:"", hits:[]};
  // 질문이 있으면 선택한 공종 안에서 먼저, 없으면 전체에서 찾는다
  const pool = picked ? [picked] : TASKS.filter(t => t.trade === state.trade);
  let ranked = pool.map(t => ({t, s:score(t,q)})).sort((a,b)=>b.s-a.s);
  if (!picked && (!ranked[0] || ranked[0].s < 2)){
    ranked = TASKS.map(t => ({t, s:score(t,q)})).sort((a,b)=>b.s-a.s);
  }
  if (!ranked[0] || ranked[0].s < 2){
    return {kind:"none", q, suggestions: TASKS.filter(t=>t.trade===state.trade).map(t=>t.name)};
  }
  const best = ranked[0].t;
  const low = q.toLowerCase();
  const hits = best.items.map((it,i)=>({i, hit: it.split(/[\s(),·]+/).some(w => w.length>=2 && low.includes(w.toLowerCase()))}))
                         .filter(x=>x.hit).map(x=>x.i);
  return {kind:"task", task:best, q, hits};
}

function ask(){
  const ans = findAnswer();
  const box = $("result");
  box.classList.remove("hidden");
  if (ans.kind === "empty"){
    state.current = null;
    box.innerHTML = `<div class="card"><div class="notfound"><span class="badge b-warn">확인 필요</span>
      공종과 작업을 고르거나 질문을 입력해 주세요.</div></div>`;
    return;
  }
  if (ans.kind === "none"){
    state.current = null;
    const sug = ans.suggestions.map(n=>`<li>${esc(n)}</li>`).join("");
    box.innerHTML = `<div class="card"><h2>2. 결과</h2><div class="notfound">
      <span class="badge b-warn">확인 필요</span><b>등록된 자료에서 맞는 항목을 찾지 못했어요.</b>
      <p style="margin:8px 0 0">추측해서 답하지 않았어요. 담당 안전관리자나 원문 자료로 확인해 주세요.</p>
      ${sug ? `<p style="margin:10px 0 4px">${esc(state.trade)} 공종에 등록된 작업:</p><ul style="margin:0;padding-left:20px">${sug}</ul>`:""}
      </div></div>`;
    return;
  }
  const task = ans.task;
  state.current = { taskId:task.id, taskName:task.name, trade:task.trade, question:ans.q,
    marks: task.items.map(()=> "") };
  const hitSet = new Set(ans.hits);
  const summary = ans.q
    ? `"${esc(ans.q)}" 질문에 가장 가까운 작업은 <b>${esc(task.name)}</b>(${esc(task.trade)})예요. 작업 전 확인 항목 ${task.items.length}개를 보여드려요.`
    : `<b>${esc(task.name)}</b>(${esc(task.trade)}) 작업 전 확인 항목 ${task.items.length}개예요.`;
  box.innerHTML = `
    <div class="card">
      <h2>2. 결과</h2>
      <span class="badge b-sample">${DATA_LABEL}</span><span class="badge b-warn">근거 확인 필요</span>
      <div class="summary">${summary}${hitSet.size?`<br><small>질문과 관련 있는 항목은 초록 테두리로 표시했어요.</small>`:""}</div>
      <ul class="check" id="checkList">
        ${task.items.map((it,i)=>`
        <li class="${hitSet.has(i)?"hit":""}" data-i="${i}">
          <div class="itxt">${i+1}. ${esc(it)}</div>
          <div class="seg" role="group" aria-label="${i+1}번 항목 점검 결과">
            <button type="button" class="s-ok" data-v="확인" aria-pressed="false">확인</button>
            <button type="button" class="s-na" data-v="해당 없음" aria-pressed="false">해당 없음</button>
            <button type="button" class="s-no" data-v="미확인" aria-pressed="false">미확인</button>
          </div>
        </li>`).join("")}
      </ul>
      <div class="count" id="progress"></div>
      <div class="src"><b>근거</b> <span class="badge b-sample">${SOURCE_NOTE.type}</span><br>
        ${esc(SOURCE_NOTE.text)}<br><small>${esc(SOURCE_NOTE.ref)}</small></div>
      <button class="btn block" id="saveBtn">점검 결과 저장</button>
    </div>`;
  box.querySelectorAll("#checkList li").forEach(li => {
    const i = +li.dataset.i;
    li.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
      const v = b.dataset.v;
      state.current.marks[i] = (state.current.marks[i] === v) ? "" : v;
      li.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.v === state.current.marks[i])));
      updateProgress();
    }));
  });
  $("saveBtn").addEventListener("click", saveResult);
  updateProgress();
  box.scrollIntoView({behavior:"smooth", block:"start"});
}
function updateProgress(){
  if (!state.current) return;
  const m = state.current.marks, done = m.filter(Boolean).length;
  $("progress").textContent = `표시한 항목 ${done} / ${m.length}  (확인 ${m.filter(x=>x==="확인").length}, 해당 없음 ${m.filter(x=>x==="해당 없음").length}, 미확인 ${m.filter(x=>x==="미확인").length})`;
}

/* ===================== 점검 결과 저장 ===================== */
function saveResult(){
  if (!state.current) return;
  const marks = state.current.marks;
  if (!marks.some(Boolean)){ toast("항목을 하나 이상 표시한 뒤 저장해 주세요."); return; }
  const task = TASKS.find(t => t.id === state.current.taskId);
  const rec = {
    id: Date.now(),
    date: $("checkDate").value || todayStr(),
    siteName: $("siteName").value.trim() || "(작업명 없음)",
    trade: task.trade, taskName: task.name,
    question: state.current.question,
    items: task.items.map((it,i)=>({text:it, mark: marks[i] || "미표시"})),
    dataType: DATA_LABEL
  };
  const list = loadSaved(); list.unshift(rec);
  storeSaved(list);
  toast(usingMem ? "저장했어요. (브라우저 저장소를 쓸 수 없어 이 탭을 닫으면 사라져요)" : "저장했어요. '저장된 점검'에서 볼 수 있어요.");
  renderSaved();
}
function renderSaved(){
  const list = loadSaved();
  $("savedCount").textContent = list.length ? `(${list.length})` : "";
  if (!list.length){
    $("savedList").innerHTML = `<div class="empty">저장된 점검이 없어요.<br>질문하기 화면에서 점검 결과를 저장해 보세요.</div>`;
    return;
  }
  $("savedList").innerHTML = list.map(r => {
    const c = k => r.items.filter(x=>x.mark===k).length;
    return `<div class="saved-item" data-id="${r.id}">
      <h3>${esc(r.siteName)}</h3>
      <div class="meta">${esc(r.date)} · ${esc(r.trade)} · ${esc(r.taskName)} <span class="badge b-sample">${esc(r.dataType)}</span></div>
      <div class="meta">확인 ${c("확인")} · 해당 없음 ${c("해당 없음")} · 미확인 ${c("미확인")} · 미표시 ${c("미표시")}</div>
      <div class="detail hidden">${r.items.map((x,i)=>`<div>${i+1}. ${esc(x.text)} <b>[${esc(x.mark)}]</b></div>`).join("")}</div>
      <div class="acts">
        <button type="button" class="btn ghost" data-act="toggle">자세히 보기</button>
        <button type="button" class="btn danger" data-act="del">삭제</button>
      </div>
    </div>`;
  }).join("") + `<button type="button" class="btn danger" id="clearAll" style="margin-top:6px">전체 삭제</button>`;
  $("savedList").querySelectorAll(".saved-item").forEach(el => {
    el.querySelector('[data-act="toggle"]').addEventListener("click", e => {
      const d = el.querySelector(".detail"); d.classList.toggle("hidden");
      e.target.textContent = d.classList.contains("hidden") ? "자세히 보기" : "접기";
    });
    el.querySelector('[data-act="del"]').addEventListener("click", () => {
      if (!confirm("이 점검 기록을 삭제할까요?")) return;
      storeSaved(loadSaved().filter(r => String(r.id) !== el.dataset.id)); renderSaved();
    });
  });
  $("clearAll").addEventListener("click", () => {
    if (!confirm("저장된 점검 기록을 모두 삭제할까요?")) return;
    storeSaved([]); renderSaved();
  });
}


/* ===================== 챗봇 (규칙 기반, 샘플 데이터만 사용) ===================== */
/* ★ AI 답변 모드 설정: Cloudflare Worker 주소를 여기에 넣으세요 (예: "https://safetalk-ai.내계정.workers.dev").
   비워두면 AI 모드는 꺼지고 규칙 기반 챗봇만 동작합니다. API 키는 여기에 절대 넣지 마세요(Worker 비밀값에만 저장). */
const AI_ENDPOINT = "https://safetalk-ai-bj.djbj1167.workers.dev";
const chat = { inited:false, last:null, busy:false, ai:false, history:[] };

function aiData(){ return TASKS.map(t=>({id:t.id, trade:t.trade, name:t.name, items:t.items})); }
function fmtAI(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>");
}
async function askAI(q){
  chat.busy = true;
  const t = document.createElement("div");
  t.className = "typing"; t.textContent = "AI가 체크리스트 데이터를 보고 답하는 중…";
  $("chatLog").appendChild(t); $("chatLog").scrollTop = $("chatLog").scrollHeight;
  const ctl = new AbortController(), timer = setTimeout(()=>ctl.abort(), 25000);
  try{
    const res = await fetch(AI_ENDPOINT, {
      method:"POST", headers:{"Content-Type":"application/json"}, signal:ctl.signal,
      body: JSON.stringify({ question:q, history:chat.history.slice(-6), data:aiData() })
    });
    if (!res.ok) throw new Error("HTTP "+res.status);
    const out = await res.json();
    if (!out.answer) throw new Error("빈 응답");
    t.remove();
    const task = TASKS.find(x=>x.id===out.taskId);
    if (task) chat.last = task;
    chat.history.push({role:"user", text:q}, {role:"model", text:out.answer});
    const m = addMsg("bot", `<div>${fmtAI(out.answer)}</div>
      <div class="badges"><span class="badge b-ai">AI 답변</span><span class="badge b-sample">${DATA_LABEL} 기준</span><span class="badge b-warn">근거 확인 필요</span></div>
      <small>AI가 샘플 체크리스트 안에서만 답하도록 제한했지만 틀릴 수 있어요. 최종 판단은 안전관리자가 해 주세요.</small>
      ${task?`<div class="acts"><button type="button" class="primary" data-open="${task.id}">${esc(task.name)} 점검표로 열어 체크하기</button></div>`:""}`);
    bindActs(m, q);
  }catch(e){
    t.remove();
    addMsg("bot", `<small>AI 서버에 연결하지 못해 <b>기본 챗봇</b>으로 답할게요. (${esc(e.name==="AbortError"?"시간 초과":e.message)})</small>`);
    chat.busy = false;
    answerChat(q);
    return;
  }finally{
    clearTimeout(timer);
  }
  chat.busy = false;
}
const WORD_SPLIT = /[\s(),·]+/;
const STOP = new Set(["작업","확인","여부","상태","확인했는","여부를","전에","작업이","있는","했는"]);
function stem(w){ return w.replace(/(했는가|있는가|하고|인가|으로|에서|을|를|은|는|이|가|의|에|와|과|로|도)$/,""); }
function itemHits(task, q){
  const low = q.toLowerCase();
  return task.items.map((it,i)=>({i, hit: it.split(WORD_SPLIT).some(w => {
      const s = stem(w.toLowerCase());
      return s.length>=2 && !STOP.has(s) && low.includes(s);
  })})).filter(x=>x.hit).map(x=>x.i);
}
function addMsg(who, html){
  const d = document.createElement("div");
  d.className = "msg " + who;
  if (who === "user") d.textContent = html; else d.innerHTML = html;
  $("chatLog").appendChild(d);
  $("chatLog").scrollTop = $("chatLog").scrollHeight;
  return d;
}
function botSay(html, bind){
  chat.busy = true;
  const t = document.createElement("div");
  t.className = "typing"; t.textContent = "답변을 찾는 중…";
  $("chatLog").appendChild(t); $("chatLog").scrollTop = $("chatLog").scrollHeight;
  setTimeout(() => {
    t.remove();
    const m = addMsg("bot", html);
    if (bind) bind(m);
    chat.busy = false;
  }, 350);
}
function openInChecklist(task, q){
  state.trade = task.trade; state.taskId = task.id;
  renderTrades(); renderTasks(); renderExamples();
  $("question").value = q || "";
  show("ask"); ask();
}
function taskChipsHtml(list){
  return list.map(t=>`<button type="button" data-pick="${t.id}">${esc(t.name)}</button>`).join("");
}
function bindActs(m, q){
  m.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => {
    openInChecklist(TASKS.find(t=>t.id===b.dataset.open), q);
  }));
  m.querySelectorAll("[data-pick]").forEach(b => b.addEventListener("click", () => {
    const t = TASKS.find(x=>x.id===b.dataset.pick);
    chatSend(t.name + " 확인 항목 알려줘");
  }));
}
function answerChat(q){
  const low = q.toLowerCase();
  if (/^(안녕|하이|hi|hello|반가)/.test(low) ){
    return botSay("안녕하세요! 작업 전 점검 항목을 질문으로 찾아드리는 안전톡 챗봇이에요. <br>예: <b>\"용접할 때 화재 예방은?\"</b>, <b>\"전기 배선 작업 전 확인할 것\"</b>");
  }
  if (/(도움|사용법|뭘.*(할 수|물어)|뭐.*(할 수|물어)|목록|리스트|작업.*종류|어떤.*작업)/.test(low)){
    const rows = TRADES.map(tr => `<b>${esc(tr)}</b>: ${TASKS.filter(t=>t.trade===tr).map(t=>esc(t.name)).join(", ")||"-"}`).join("<br>");
    return botSay("지금 물어볼 수 있는 작업이에요.<br>"+rows+"<div class='acts'>"+taskChipsHtml(TASKS)+"</div>", m=>bindActs(m,""));
  }
  if (/(고마|감사|땡큐)/.test(low)) return botSay("도움이 됐다면 다행이에요. 현장 최종 판단은 꼭 안전관리자와 함께 해 주세요.");

  // 전체 작업에서 점수 계산
  let ranked = TASKS.map(t=>({t, s:score(t,q)})).sort((a,b)=>b.s-a.s);
  let best = ranked[0], usedContext = false;
  if (best.s < 2 && chat.last){
    // 후속 질문: 직전 작업의 항목에 대한 질문이면 그 작업으로 답한다
    if (itemHits(chat.last, q).length){ best = {t:chat.last, s:2}; usedContext = true; }
  }
  if (best.s < 2){
    return botSay(`<span class="badge b-warn">확인 필요</span><b>등록된 자료에서 맞는 항목을 찾지 못했어요.</b><br>
      추측해서 답하지 않을게요. 담당 안전관리자나 원문 자료로 확인해 주세요.<br><small>아래 작업 중에서 골라 보세요.</small>
      <div class="acts">${taskChipsHtml(TASKS)}</div>`, m=>bindActs(m,q));
  }
  const task = best.t, hits = itemHits(task, q), hitSet = new Set(hits);
  chat.last = task;
  const close = ranked.filter(r => r.t.id !== task.id && r.s >= 2 && r.s >= best.s*0.75).slice(0,3);
  const lead = usedContext ? `앞에서 본 <b>${esc(task.name)}</b>(${esc(task.trade)}) 기준으로 답할게요.`
                           : `질문과 가장 가까운 작업은 <b>${esc(task.name)}</b>(${esc(task.trade)})예요.`;
  const list = task.items.map((it,i)=>`<li class="${hitSet.has(i)?"hit":""}">${esc(it)}${hitSet.has(i)?" <small>(질문과 관련)</small>":""}</li>`).join("");
  botSay(`${lead} 작업 전 확인 항목 ${task.items.length}개예요.
    <ol>${list}</ol>
    <div class="badges"><span class="badge b-sample">${DATA_LABEL}</span><span class="badge b-warn">근거 확인 필요</span></div>
    <small>${esc(SOURCE_NOTE.text)}</small>
    <div class="acts">
      <button type="button" class="primary" data-open="${task.id}">점검표로 열어 체크하기</button>
      ${close.map(r=>`<button type="button" data-pick="${r.t.id}">${esc(r.t.name)}도 보기</button>`).join("")}
    </div>`, m=>bindActs(m,q));
}
function chatSend(text){
  text = (text||"").trim();
  if (!text || chat.busy) return;
  addMsg("user", text);
  if (chat.ai && AI_ENDPOINT) askAI(text); else answerChat(text);
}
function renderChatQuick(){
  const pool = ["고소작업 전에 뭘 확인해야 해?","용접 작업할 때 화재 예방은?","전기 배선 작업 전 정전 확인은?","작업 전 안전회의에서 뭘 말해야 해?","물어볼 수 있는 작업 목록"];
  $("chatQuick").innerHTML = pool.map(q=>`<button type="button">${esc(q)}</button>`).join("");
  $("chatQuick").querySelectorAll("button").forEach(b => b.addEventListener("click", () => chatSend(b.textContent)));
}
function initChat(){
  if (chat.inited) return;
  chat.inited = true;
  renderChatQuick();
  const tg = $("aiToggle");
  if (!AI_ENDPOINT){
    tg.disabled = true; tg.checked = false; $("aiToggleLbl").classList.add("off");
    $("aiToggleTxt").textContent = "AI 답변 모드 (서버 미연결)";
  } else {
    tg.checked = true; chat.ai = true;
  }
  tg.addEventListener("change", () => {
    chat.ai = tg.checked;
    addMsg("bot", chat.ai ? "<small>AI 답변 모드를 켰어요. 체크리스트 데이터 안에서만 답해요.</small>" : "<small>기본 챗봇(규칙 기반)으로 바꿨어요.</small>");
  });
  addMsg("bot", `안녕하세요, <b>안전톡 챗봇</b>이에요. 작업 전 점검 항목을 질문으로 찾아드려요.<br>
    <small>답변은 팀이 만든 <b>샘플 데이터</b> 기준이고, 실제 법령·사내 기준이 아니에요. 최종 판단은 안전관리자가 해 주세요.</small>`);
}
$("chatForm").addEventListener("submit", e => { e.preventDefault(); const v = $("chatInput").value; $("chatInput").value = ""; chatSend(v); });

/* ===================== 화면 전환 / 시작 ===================== */
function show(which){
  ["ask","chat","saved"].forEach(v => {
    $("view-"+v).classList.toggle("hidden", v !== which);
    $("tab-"+v).setAttribute("aria-selected", String(v === which));
  });
  if (which === "saved") renderSaved();
  if (which === "chat") { initChat(); $("chatInput").focus({preventScroll:true}); }
}
$("tab-chat").addEventListener("click", () => show("chat"));
$("tab-ask").addEventListener("click", () => show("ask"));
$("tab-saved").addEventListener("click", () => show("saved"));
$("askBtn").addEventListener("click", ask);
$("task").addEventListener("change", () => { state.taskId = $("task").value || null; });
$("question").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) ask(); });

$("checkDate").value = todayStr();
renderTrades(); renderTasks(); renderExamples(); renderSaved();
</script>
</body>
